services:
  app:
    build: .
    container_name: test_betalent
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - GATEWAY1_URL=http://mock-gateways:3001
      - GATEWAY2_URL=http://mock-gateways:3002
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - betalent-network

  mysql:
    image: mysql:8.0
    container_name: betalent-mysql
    restart: always
    environment:
      MYSQL_DATABASE: betalent
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
    networks:
      - betalent-network

  mock-gateways:
    image: matheusprotzen/gateways-mock
    container_name: betalent-mocks
    ports:
      - "3001:3001"
      - "3002:3002"
    networks:
      - betalent-network

volumes:
  mysql_data:
  node_modules:

networks:
  betalent-network:
    driver: bridge